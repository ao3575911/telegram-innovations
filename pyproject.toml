[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "telegram-innovation"
version = "0.1.0"
description = "RallyPoint: conditional group commitments for Telegram."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "RallyPoint contributors"}]
dependencies = ["httpx==0.28.1"]

[project.scripts]
rallypoint = "telegram_innovation.__main__:main"

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_innovation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
